services:
  eureka-service:
    image: eurekaserverimage:latest
    ports:
      - "8761:8761"
    labels:
      kompose.service.type: nodeport
      kompose.service.nodeport.port: "30761"
      kompose.image-pull-policy: IfNotPresent

  mysqlcontainer:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bank_db
    ports:
      - "3306:3306"
    labels:
      kompose.image-pull-policy: IfNotPresent

  gateway-service:
    image: getwayimages:latest
    ports:
      - "8765:8765"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-service:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Deureka.client.serviceUrl.defaultZone=http://eureka-service:8761/eureka/ -Deureka.instance.preferIpAddress=true"
    labels:
      kompose.service.type: nodeport
      kompose.service.nodeport.port: "30765"
      kompose.image-pull-policy: IfNotPresent

  auth-service:
    image: identityserviceimage:latest
    ports:
      - "9898:9898"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqlcontainer:3306/bank_db"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-service:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Deureka.client.serviceUrl.defaultZone=http://eureka-service:8761/eureka/ -Deureka.instance.preferIpAddress=true"
    labels:
      kompose.image-pull-policy: IfNotPresent

  account-service:
    image: accountserviceimage:latest
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqlcontainer:3306/bank_db"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-service:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Deureka.client.serviceUrl.defaultZone=http://eureka-service:8761/eureka/ -Deureka.instance.preferIpAddress=true"
    labels:
      kompose.image-pull-policy: IfNotPresent

  customer-service:
    image: customerserviceimage:latest
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqlcontainer:3306/bank_db"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      ACCOUNT_SERVICE_URL: "http://account-service:8082"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-service:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Deureka.client.serviceUrl.defaultZone=http://eureka-service:8761/eureka/ -Deureka.instance.preferIpAddress=true"
    labels:
      kompose.image-pull-policy: IfNotPresent

  bank-portal:
    image: bankfrontend:latest
    ports:
      - "80:80"
    labels:
      kompose.service.type: nodeport
      kompose.service.nodeport.port: "30080"
      kompose.image-pull-policy: IfNotPresent